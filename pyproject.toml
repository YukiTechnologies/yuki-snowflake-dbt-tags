[project]
name = "yuki-snowflake-dbt-tags"
# Placeholder required by uv's [project] table; this dev env is never published,
# so it does not track the dbt package version (see dbt_project.yml / CHANGELOG).
version = "0.0.0"
description = "Dev environment for the yuki_snowflake_dbt_tags dbt package"
requires-python = ">=3.11"
dependencies = [
    "dbt-snowflake>=1.8",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
